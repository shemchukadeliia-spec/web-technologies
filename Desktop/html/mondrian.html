<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Завдання 2 - Мондріан</title>
</head>
<body>
  <table border="1" style="border-collapse: collapse; background-color: #000000; width: 400px; height: 400px; border-spacing: 5px;">
    <tr style="height: 10%;">
      <td style="background-color: #ffffff; width: 10%;"></td>
      <td style="background-color: #ffffff; width: 60%;"></td>
      <td colspan="2" style="background-color: #fffa69; width: 30%;"></td>
    </tr>
    <tr style="height: 50%;">
      <td style="background-color: #ffffff;"></td>
      <td style="background-color: #ff5b2d;"></td>
      <td colspan="2" style="background-color: #fffa69;"></td>
    </tr>
    <tr style="height: 20%;">
      <td style="background-color: #ffffff;"></td>
      <td style="background-color: #ffffff;"></td>
      <td style="background-color: #ffffff; width: 15%;"></td>
      <td style="background-color: #ffffff; width: 15%;"></td>
    </tr>
    <tr style="height: 20%;">
      <td style="background-color: #fffa69;"></td>
      <td style="background-color: #ffffff;"></td>
      <td colspan="2" style="background-color: #074481;"></td>
    </tr>
  </table>
</body>
</html>
