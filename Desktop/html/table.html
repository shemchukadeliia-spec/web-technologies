<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Завдання 1 - Таблиця</title>
</head>
<body style="background-color: #f4f4f4; margin: 20px;">
  <table border="1" style="border-width: 2px; border-collapse: collapse; margin: 0 auto;">
    <tr>
      <td colspan="5" style="background-color: #55e6c1; height: 30px;"></td>
    </tr>
    <tr>
      <td rowspan="3" style="background-color: #55e6c1; width: 30px;"></td>
      <td colspan="3" style="background-color: #f8efba; height: 30px;"></td>
      <td rowspan="3" style="background-color: #55e6c1; width: 30px;"></td>
    </tr>
    <tr>
      <td style="background-color: #f8efba; width: 30px;"></td>
      <td>
        <!-- Внутренний квадрат с яркими цветами -->
        <table border="1" style="border-width: 2px; border-collapse: collapse; width: 100px; height: 100px;">
          <tr>
            <td style="background-color: #ff0000; width: 50%;"></td>
            <td style="background-color: #0000ff; width: 50%;"></td>
          </tr>
          <tr>
            <td style="background-color: #00ff00;"></td>
            <td style="background-color: #ffff00;"></td>
          </tr>
        </table>
      </td>
      <td style="background-color: #f8efba; width: 30px;"></td>
    </tr>
    <tr>
      <td colspan="3" style="background-color: #f8efba; height: 30px;"></td>
    </tr>
    <tr>
      <td colspan="5" style="background-color: #55e6c1; height: 30px;"></td>
    </tr>
  </table>
</body>
</html>
